<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ArmikTech – armiktech.com</title>
    <meta name="description" content="ArmikTech – Technik und mehr. Durchstöbern Sie unseren Shop.">

    <meta name="theme-color" content="#0a84ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebaseapp.com">
    <style>
        body { font-family: Outfit, system-ui, sans-serif; overscroll-behavior-y: none; }
        .font-mono, .tabular-nums { font-variant-numeric: tabular-nums; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 5px;
            border: 2px solid #f8fafc;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        .boot-skeleton {
            min-height: 100%;
            background: #f8fafc;
        }
        .boot-skeleton-bar {
            height: 3.5rem;
            background: #fff;
            border-bottom: 1px solid #e4e4e7;
        }
        .boot-skeleton-hero {
            min-height: 70vh;
            background: linear-gradient(180deg, #e4e4e7 0%, #f4f4f5 100%);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root">
        <div class="boot-skeleton" aria-busy="true" aria-label="Loading">
            <div class="boot-skeleton-bar"></div>
            <div class="boot-skeleton-hero"></div>
        </div>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
